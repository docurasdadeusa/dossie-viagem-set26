<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquivo protegido</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: claro e factual, sem ornamentos
   IDEA: um app de arquivos da Apple, com fatos e provas em cartões arredondados
   PICTURE: cronologia em lista agrupada com etiquetas de prova e grade de miniaturas
   COLOUR and TYPE: cinza #f5f5f7, cartões brancos, azul #0071e3; Inter em pesos 400 a 700
   LAYOUT: cabeçalho grande, números em cartões, seções em listas agrupadas que viram fichas no celular */
:root{color-scheme:light dark;--bg:light-dark(#f5f5f7,#000000);--card:light-dark(#ffffff,#1c1c1e);--ink:light-dark(#1d1d1f,#f5f5f7);--muted:light-dark(#6e6e73,#98989d);--line:light-dark(#e8e8ed,#2c2c2e);--accent:light-dark(#0071e3,#0a84ff);--chip:light-dark(#e8f1fc,#0b2a4a);--fill:light-dark(#f2f2f7,#2c2c2e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.band{padding:clamp(24px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1120px;margin:0 auto}
.read{max-width:820px}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.03em}
h2{font-size:clamp(26px,3vw,34px);margin-bottom:14px}
h3{font-size:19px;margin:28px 0 12px}
p{margin:0 0 12px}
.lede{font-size:19px;max-width:62ch;color:var(--muted);margin:14px 0 0;line-height:1.45}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.facts div{background:var(--card);border-radius:14px;padding:10px 16px;font-size:15px}
.facts b{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:16px}
.kpi{background:var(--card);border-radius:20px;padding:20px 22px}
.kpi strong{display:block;font-size:clamp(30px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05;white-space:nowrap;color:var(--accent)}
.kpi span{font-size:14px;color:var(--muted);display:block;margin-top:6px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.toc a{flex:none;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;background:var(--card);padding:8px 14px;border-radius:999px;min-height:38px;display:inline-flex;align-items:center}
.toc a:hover{color:var(--accent)}
.sec-intro{color:var(--muted);max-width:70ch;margin:-4px 0 18px}
.panel{background:var(--card);border-radius:20px;padding:6px 20px}
.panel.text{padding:22px 24px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:14px 10px 8px;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:13px 10px;vertical-align:top}
tr:last-child td{border-bottom:0}
td.t{white-space:nowrap;font-weight:600;width:1%}
td.v{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:0;background:var(--chip);color:var(--accent);font:600 13px Inter,-apple-system,sans-serif;padding:6px 11px;border-radius:999px;cursor:pointer;min-height:30px;display:inline-flex;align-items:center}
.chip:hover{background:var(--accent);color:#fff}
.st{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
.st.ok{background:light-dark(#e3f5e8,#0f2e1a);color:light-dark(#1a7f37,#30d158)}
.st.pa{background:light-dark(#fff3dc,#33270b);color:light-dark(#a05a00,#ffd60a)}
.st.pe{background:light-dark(#fde8e7,#3a1210);color:light-dark(#c62828,#ff6961)}
.st.no{background:var(--fill);color:var(--muted)}
.list{margin:0;padding-left:20px}
.list li{margin-bottom:8px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;font:600 15px Inter,-apple-system,sans-serif;padding:11px 20px;min-height:44px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:var(--fill);color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.thumb:focus-visible,.toc a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:14px;color:var(--muted);min-height:1.4em;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px}
.card{background:var(--card);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.thumb{appearance:none;border:0;padding:0;margin:0;background:var(--fill);aspect-ratio:4/5;width:100%;cursor:zoom-in;position:relative;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb .tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:#1d1d1f;font:700 12px Inter,-apple-system,sans-serif;padding:4px 9px;border-radius:999px}
.thumb .kind{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h4{font-size:15px;font-weight:600;margin:0;line-height:1.3}
.body p{margin:0;font-size:14px;color:var(--muted)}
.fname{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.row{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.row .btn{flex:1;justify-content:center;font-size:14px;padding:8px 10px;min-height:38px}
footer{color:var(--muted);font-size:13px}
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,1100px);max-height:96vh;width:100%}
dialog::backdrop{background:rgba(0,0,0,.82);backdrop-filter:blur(8px)}
.viewer{display:flex;flex-direction:column;gap:12px;align-items:center}
.viewer img,.viewer video{max-width:100%;max-height:76vh;border-radius:18px;background:#000;display:block}
.vbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;color:#fff;font-size:14px;text-align:center}
.vbar .btn{background:rgba(255,255,255,.16);color:#fff}
.vbar .btn.pri{background:#fff;color:#1d1d1f}
#vtitle{flex-basis:100%}
html{scroll-padding-top:20px;scroll-behavior:smooth}
@media(max-width:600px){.panel{padding:4px 16px}table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:12px;border-bottom:1px solid var(--line)}.stack tr:last-child{border-bottom:0}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start;white-space:normal;width:auto}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;white-space:normal;font-size:12px;color:var(--muted);font-weight:500}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .2s}.card:hover{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
<style>
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lock form{background:var(--card);border-radius:24px;padding:32px 28px;width:min(100%,400px);display:flex;flex-direction:column;gap:14px;text-align:center}
.lock svg{margin:0 auto}
.lock h1{font-size:28px}
.lock p{color:var(--muted);margin:0;font-size:15px}
.lock input{font:16px Inter,-apple-system,sans-serif;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--fill);color:var(--ink);text-align:center;min-height:48px}
.lock input:focus{outline:3px solid var(--accent);outline-offset:1px}
.lock .btn{justify-content:center}
.lock .err{color:light-dark(#c62828,#ff6961);min-height:1.3em;font-size:14px}
</style>
</head>
<body>
<main class="lock" id="lock"><form id="f" autocomplete="off">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10.5" rx="3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
<h1>Arquivo protegido</h1>
<p>Digite a senha recebida para abrir.</p>
<input id="pw" type="password" placeholder="Senha" aria-label="Senha" autofocus>
<button class="btn" type="submit" id="go">Abrir</button>
<div class="err" id="err" role="alert"></div>
</form></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
{
const SALT='f41667d1aab4b5e434c2ac828d4d9297',ITER=600000;
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
let KEY=null,FILES=null;const cache={};
async function dec(buf){const b=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12))}
async function getBin(name){const r=await fetch('c/'+name,{cache:'no-store'});if(!r.ok)throw new Error('fetch');return dec(await r.arrayBuffer())}
window.B=async p=>{if(cache[p])return cache[p];const e=FILES[p];if(!e)throw new Error('missing');const b=new Blob([await getBin(e[0])],{type:e[1]});cache[p]=b;return b};
const urls={};window.U=async p=>urls[p]||(urls[p]=URL.createObjectURL(await B(p)));
window.hydrate=root=>{for(const im of root.querySelectorAll('img[data-src]')){const p=im.dataset.src;im.removeAttribute('data-src');U(p).then(u=>{im.src=u}).catch(()=>{})}};
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  KEY=await crypto.subtle.deriveKey({name:'PBKDF2',salt:hex(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const m=JSON.parse(new TextDecoder().decode(await getBin('m.bin')));
  FILES=m.files;
  document.title='Dossiê do caso';
  document.body.innerHTML=m.markup;
  new Function(m.js)();
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;if(!pw)return;
  err.textContent='';go.disabled=true;go.textContent='Abrindo…';
  try{await unlock(pw);try{sessionStorage.setItem('k',pw)}catch(_){}}
  catch(x){KEY=null;err.textContent='Senha incorreta. Tente de novo.';go.disabled=false;go.textContent='Abrir'}
});
try{const s=sessionStorage.getItem('k');if(s)unlock(s).catch(()=>{try{sessionStorage.removeItem('k')}catch(_){}})}catch(_){}
}
</script>
</body>
</html>
